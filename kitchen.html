<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cuisine — Brimo Chicken</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="order.css">

<style>

body{
background:#f4f3f1;
color:#20201f;
}

.kitchen-shell{
width:min(1440px,calc(100% - 48px));
margin:auto;
}

.kitchen-head{
position:relative;
padding:34px 0 28px;
border-bottom:1px solid #dedbd7;
padding-right:60px;
}

.kitchen-kicker{
display:block;
color:#e97622;
font-size:.7rem;
letter-spacing:.16em;
font-weight:700;
margin-bottom:7px;
}

.kitchen-head h1{
font-size:1.75rem;
letter-spacing:.02em;
margin:0;
}

.kitchen-head p{
margin:8px 0 0;
color:#77736e;
font-size:.86rem;
}


/* =========================
   MENU TROIS POINTS
========================= */

.kitchen-menu{
position:absolute;
right:0;
top:30px;
}

.kitchen-menu-btn{
width:44px;
height:44px;
border:1px solid #ddd8d2;
border-radius:12px;
background:#fff;
font-size:27px;
line-height:1;
cursor:pointer;
color:#333;
transition:.2s;
}

.kitchen-menu-btn:hover{
background:#f0eeeb;
}

.kitchen-menu-dropdown{
display:none;
position:absolute;
right:0;
top:52px;
width:230px;
background:#fff;
border:1px solid #e5e1dc;
border-radius:15px;
box-shadow:0 12px 30px rgba(0,0,0,.12);
padding:7px;
z-index:1000;
}

.kitchen-menu-dropdown.show{
display:block;
}

.kitchen-menu-dropdown button{
width:100%;
border:0;
background:#fff;
padding:13px;
border-radius:10px;
text-align:left;
font-family:Montserrat,sans-serif;
font-weight:600;
font-size:14px;
cursor:pointer;
color:#333;
}

.kitchen-menu-dropdown button:hover{
background:#f4f3f1;
}


/* =========================
   COMMANDES
========================= */

.kitchen-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
gap:24px;
padding:30px 0 48px;
}

.ticket{
min-height:340px;
background:#fff;
border:1px solid #e5e1dc;
border-radius:22px;
padding:26px;
box-shadow:0 12px 34px rgba(58,45,33,.08);
display:flex;
flex-direction:column;
transition:transform .2s,box-shadow .2s;
}

.ticket:hover{
transform:translateY(-2px);
box-shadow:0 18px 42px rgba(58,45,33,.12);
}

.ticket__head{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:18px;
padding-bottom:18px;
border-bottom:1px solid #eeeae5;
}

.ticket__id{
margin:0;
font-size:1.08rem;
letter-spacing:.06em;
color:#272522;
}

.ticket__table{
margin:7px 0 0;
color:#77736e;
font-size:.86rem;
}

.ticket__total{
font-size:1.15rem;
color:#8d3f09;
white-space:nowrap;
}

.customer{
margin:20px 0 15px;
}

.customer strong{
display:block;
font-size:.96rem;
margin-bottom:6px;
}

.customer span{
color:#77736e;
font-size:.83rem;
}

.ticket ul{
list-style:none;
margin:0;
padding:14px 0;
border-top:1px solid #eeeae5;
flex:1;
}

.ticket li{
display:flex;
justify-content:space-between;
gap:16px;
padding:8px 0;
font-size:.89rem;
line-height:1.4;
}

.ticket li b{
color:#c45f15;
margin-right:7px;
}

.ticket li small{
display:block;
color:#89847e;
margin:3px 0 0 23px;
}

.ticket__time{
padding-top:15px;
border-top:1px solid #eeeae5;
color:#77736e;
font-size:.78rem;
letter-spacing:.02em;
}


/* =========================
   BOUTON PRÊT
========================= */

.ready-btn{
margin-top:18px;
padding:14px;
width:100%;
border:none;
border-radius:14px;
background:#18b35b;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.ready-btn:hover{
background:#13924b;
}

.ready-btn:disabled{
opacity:.6;
cursor:wait;
}


/* =========================
   VIDE
========================= */

.kitchen-empty{
grid-column:1/-1;
text-align:center;
padding:58px 20px;
color:#85807a;
border:1px dashed #d5d0c9;
border-radius:18px;
background:rgba(255,255,255,.55);
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

.kitchen-shell{
width:min(100% - 28px,1440px);
}

.kitchen-head{
padding:22px 55px 22px 0;
}

.kitchen-grid{
grid-template-columns:1fr;
gap:16px;
padding-top:20px;
}

.ticket{
padding:20px;
}

.kitchen-menu{
top:20px;
right:0;
}

}

</style>

</head>


<body class="order-page">


<main class="kitchen-shell">


<header class="kitchen-head">

<span class="kitchen-kicker">
BRIMO CHICKEN · KITCHEN DISPLAY
</span>

<h1>
Commandes en cours
</h1>

<p>
Les commandes reçues apparaîtront automatiquement.
</p>


<!-- MENU TROIS POINTS -->

<div class="kitchen-menu">

<button
type="button"
id="kitchenMenuBtn"
class="kitchen-menu-btn"
aria-label="Menu"
>
⋮
</button>


<div
id="kitchenMenu"
class="kitchen-menu-dropdown"
>

<button
type="button"
id="clearKitchen"
>
🧹 Vider les commandes
</button>

</div>

</div>

</header>


<section
class="kitchen-grid"
id="tickets"
aria-live="polite"
>

<div
class="kitchen-empty"
id="kitchen-empty"
>
En attente de nouvelles commandes.
</div>

</section>


</main>


<!-- =========================
     AFFICHAGE DES COMMANDES
========================= -->

<script>

(function(){

const tickets =
document.getElementById("tickets");

const empty =
document.getElementById("kitchen-empty");


const money = n =>
`${Number(n || 0).toFixed(2).replace(".00","")} DH`;


const text = v =>
String(v ?? "").replace(
/[&<>"']/g,
c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);


/*
========================================
COMMANDES MASQUÉES LOCALEMENT
========================================
*/

const HIDDEN_KEY =
"brimo_kitchen_hidden_orders_v1";


function getHiddenOrders(){

try{

return JSON.parse(
localStorage.getItem(HIDDEN_KEY) || "[]"
);

}catch{

return [];

}

}


function saveHiddenOrders(list){

localStorage.setItem(
HIDDEN_KEY,
JSON.stringify(list)
);

}


function isHidden(id){

return getHiddenOrders().includes(id);

}


function hideOrder(id){

const hidden =
getHiddenOrders();

if(!hidden.includes(id)){

hidden.push(id);

saveHiddenOrders(hidden);

}

}


/*
========================================
NOTIFICATION
========================================
*/

function playNotification(){

try{

const audio =
new Audio("notification.mp3");

audio.play().catch(() => {});

}catch(error){

console.log(
"Notification audio impossible :",
error
);

}

}


/*
========================================
CRÉATION D'UNE COMMANDE
========================================
*/

function createCard(order){

const client =
order.client || {};

const products =
order.products || [];

const date =
order.date
? new Date(order.date)
: null;

const displayDate =
date && !Number.isNaN(date.getTime())
? date.toLocaleDateString("fr-MA")
: order.date || "";


const card =
document.createElement("article");

card.className =
"ticket";

card.dataset.orderId =
order.firebaseId || "";


card.innerHTML = `

<div class="ticket__head">

<div>

<h2 class="ticket__id">

${text(order.id || order.firebaseId)}

</h2>

<p class="ticket__table">

Table ${text(client.table || "-")}

</p>

</div>

<strong class="ticket__total">

${money(order.total)}

</strong>

</div>


<div class="customer">

<strong>

${text(
(client.prenom || "") +
" " +
(client.nom || "")
)}

</strong>

<span>

${text(client.telephone || "")}

</span>

</div>


<ul>

${
products.map(p => `

<li>

<span>

<b>
×${text(p.quantity || 0)}
</b>

${text(p.name || "")}

${
p.note
? `<small>
Note : ${text(p.note)}
</small>`
: ""
}

</span>

<span>

${money(
Number(p.price || 0) *
Number(p.quantity || 0)
)}

</span>

</li>

`).join("")
}

</ul>


<div class="ticket__time">

${text(displayDate)}
·
${text(order.heure || "")}

</div>


<button
type="button"
class="ready-btn"
data-id="${text(order.firebaseId || "")}"
>

✅ PRÊT

</button>

`;


return card;

}


/*
========================================
AFFICHER UNE COMMANDE
========================================
*/

function receiveOrder(order){

if(!order)
return;


if(!order.firebaseId)
return;


/* Si elle est déjà prête */

if(order.ready === true)
return;


/* Si elle a été vidée */

if(isHidden(order.firebaseId))
return;


/* Éviter les doublons */

if(
document.querySelector(
`.ticket[data-order-id="${CSS.escape(order.firebaseId)}"]`
)
)
return;


const currentEmpty =
document.getElementById("kitchen-empty");

if(currentEmpty)
currentEmpty.remove();


tickets.prepend(
createCard(order)
);


playNotification();

}


/*
========================================
SUPPRIMER DE L'AFFICHAGE
========================================
*/

function removeOrder(firebaseId){

const card =
document.querySelector(
`.ticket[data-order-id="${CSS.escape(firebaseId)}"]`
);

if(card)
card.remove();


showEmptyIfNeeded();

}


/*
========================================
MESSAGE PANIER VIDE
========================================
*/

function showEmptyIfNeeded(){

if(
tickets.querySelector(".ticket")
)
return;


if(
document.getElementById("kitchen-empty")
)
return;


const newEmpty =
document.createElement("div");

newEmpty.className =
"kitchen-empty";

newEmpty.id =
"kitchen-empty";

newEmpty.textContent =
"En attente de nouvelles commandes.";


tickets.appendChild(
newEmpty
);

}


window.BrimoKitchen = {

receiveOrder,

createCard,

removeOrder,

showEmptyIfNeeded,

playNotification,

hideOrder

};

})();

</script>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import { db }
from "./firebase-config.js";


import {

collection,

onSnapshot,

query,

orderBy,

updateDoc,

doc

}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const ordersRef =
query(

collection(db,"orders"),

orderBy("date","desc")

);


const knownOrders =
new Set();


let firstSnapshot =
true;


/*
========================================
ÉCOUTE FIREBASE
========================================
*/

onSnapshot(

ordersRef,

(snapshot) => {


snapshot.docChanges().forEach(
(change) => {


const firebaseId =
change.doc.id;


const data =
change.doc.data();


const order = {

firebaseId,

...data

};


/*
========================================
COMMANDE MODIFIÉE
========================================
*/

if(change.type === "modified"){

/*
Si elle devient prête,
elle disparaît de Kitchen.
*/

if(order.ready === true){

BrimoKitchen.removeOrder(
firebaseId
);

}

return;

}


/*
========================================
COMMANDE SUPPRIMÉE DE FIREBASE
========================================
*/

if(change.type === "removed"){

BrimoKitchen.removeOrder(
firebaseId
);

knownOrders.delete(
firebaseId
);

return;

}


/*
========================================
NOUVELLE COMMANDE
========================================
*/

if(change.type === "added"){

/*
Commande déjà prête
*/

if(order.ready === true)
return;


/*
Commande masquée avec
"Vider les commandes"
*/

if(
BrimoKitchen &&
typeof BrimoKitchen.receiveOrder === "function"
){

if(
localStorage
.getItem("brimo_kitchen_hidden_orders_v1")
){

try{

const hidden =
JSON.parse(
localStorage.getItem(
"brimo_kitchen_hidden_orders_v1"
) || "[]"
);

if(hidden.includes(firebaseId))
return;

}catch{}

}

}


/*
Éviter les doublons
*/

if(
knownOrders.has(firebaseId)
)
return;


knownOrders.add(
firebaseId
);


/*
Afficher la commande
*/

BrimoKitchen.receiveOrder(
order
);


/*
Pas de son pour les commandes
déjà présentes au premier chargement.
*/

if(firstSnapshot){

const card =
document.querySelector(
`.ticket[data-order-id="${CSS.escape(firebaseId)}"]`
);

if(card)
card.remove();

}

}

});


firstSnapshot = false;


},

(error) => {

console.error(
"Erreur Firebase Kitchen :",
error
);

}

);


/*
========================================
BOUTON PRÊT
========================================
*/

document.addEventListener(
"click",
async (e) => {


const button =
e.target.closest(".ready-btn");


if(!button)
return;


const firebaseId =
button.dataset.id;


if(!firebaseId)
return;


button.disabled =
true;

button.textContent =
"⏳ Préparation...";


try{


await updateDoc(

doc(
db,
"orders",
firebaseId
),

{

ready:true

}

);


console.log(
"Commande prête :",
firebaseId
);


/*
La commande est retirée
automatiquement grâce à
onSnapshot.
*/


}catch(error){


console.error(
"Erreur lors de la validation :",
error
);


button.disabled =
false;

button.textContent =
"PRÊT";


alert(
"Impossible de marquer la commande comme prête."
);

}

});


/*
========================================
MENU TROIS POINTS
========================================
*/

const kitchenMenuBtn =
document.getElementById(
"kitchenMenuBtn"
);

const kitchenMenu =
document.getElementById(
"kitchenMenu"
);

const clearKitchen =
document.getElementById(
"clearKitchen"
);


/*
Ouvrir / fermer le menu
*/

kitchenMenuBtn.addEventListener(
"click",
(e) => {

e.stopPropagation();

kitchenMenu.classList.toggle(
"show"
);

});


/*
Fermer si on clique ailleurs
*/

document.addEventListener(
"click",
(e) => {

if(
!e.target.closest(".kitchen-menu")
){

kitchenMenu.classList.remove(
"show"
);

}

});


/*
========================================
VIDER LES COMMANDES
========================================
*/

clearKitchen.addEventListener(
"click",
() => {


const cards =
Array.from(
document.querySelectorAll(".ticket")
);


if(!cards.length){

kitchenMenu.classList.remove(
"show"
);

return;

}


const confirmation =
confirm(
"Vider les commandes affichées sur la cuisine ?\n\nLes commandes resteront enregistrées dans Firebase et resteront visibles dans Admin."
);


if(!confirmation)
return;


/*
Mémoriser les commandes
masquées localement.
*/

cards.forEach(card => {

const id =
card.dataset.orderId;

if(id){

const hidden =
JSON.parse(
localStorage.getItem(
"brimo_kitchen_hidden_orders_v1"
) || "[]"
);


if(!hidden.includes(id)){

hidden.push(id);

}


localStorage.setItem(

"brimo_kitchen_hidden_orders_v1",

JSON.stringify(hidden)

);

}

});


/*
Retirer visuellement
les commandes.
*/

cards.forEach(card =>
card.remove()
);


BrimoKitchen.showEmptyIfNeeded();


kitchenMenu.classList.remove(
"show"
);


console.log(
"Commandes masquées uniquement sur Kitchen."
);

});

</script>

</script>


</body>

</html>
